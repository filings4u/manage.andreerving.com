<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Reset Password | Andre Erving Management</title><link rel="stylesheet" href="assets/css/portal.css"><style>body{font-family:Inter,system-ui,sans-serif;background:#eef3fa;color:#10243e;margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.reset-card{background:white;border-radius:24px;padding:clamp(24px,4vw,48px);max-width:480px;width:100%;box-shadow:0 20px 70px #10243e20}.reset-card h1{font-size:2rem}.reset-card label{font-weight:750;display:block;margin-top:22px}.reset-card input{width:100%;border:1px solid #b6c9e0;border-radius:10px;padding:14px;margin:9px 0;box-sizing:border-box}.reset-card button{background:#2050d4;color:#fff;border:0;border-radius:10px;padding:15px;width:100%;cursor:pointer;font-weight:800;margin-top:10px}.reset-card a{color:#2050d4}.reset-card p{line-height:1.65}</style></head><body><main class="reset-card"><a href="./">← Back to sign in</a><h1>Reset your password</h1><p id="intro">Enter your account email to receive a password reset link.</p><form id="reset-request"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required><button type="submit">Send reset instructions</button></form><form id="reset-new" hidden><label for="new-password">New password</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required><button type="submit">Set new password</button></form><p role="status" id="status" aria-live="polite"></p></main><script type="module" src="assets/js/reset.js"></script></body></html>

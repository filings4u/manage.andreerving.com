<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management Portal — Andre Erving</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/portal.css"><main class="portal-shell"><header class="portal-header"><a href="./">ANDRE ERVING</a><nav><a href="https://app.andreerving.com/">Customer portal</a><button id="signout" hidden>Sign out</button></nav></header><section class="portal-panel"><h1>Website management</h1><p>Staff-only editor for articles, pages, courses, and curriculum.</p><form id="login"><label>Email address <input id="email" type="email" required autocomplete="email"></label><button type="submit">Email me a sign-in link</button></form><p id="status" role="status" aria-live="polite"></p><div id="dashboard" hidden><nav class="tabs"><button data-table="blog_posts">Blog</button><button data-table="site_pages">Pages</button><button data-table="courses">Courses</button><button data-table="course_modules">Modules</button><button data-table="course_lessons">Lessons</button><button data-table="customer_profiles">Customers</button><button data-table="orders">Orders</button><button data-table="course_enrollments">Enrollments</button><button data-table="customer_documents">Documents</button></nav><div id="items"></div><section class="item"><h2>Customer document upload</h2><p class="help">Files are private and linked to the customer’s Supabase user ID.</p><form id="upload-document"><label>Customer user ID<input name="user_id" required placeholder="UUID"></label><label>Document title<input name="title" required></label><label>File<input name="document_file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.txt,.docx"></label><button type="submit">Upload private document</button></form></section><h2 id="editor-title">Editor</h2><form id="editor"></form></div></section></main><script type="module" src="assets/js/portal.js"></script></html>
